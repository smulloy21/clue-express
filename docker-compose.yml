services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clue
      POSTGRES_PASSWORD: clue
      POSTGRES_DB: clue
    ports:
      - "5432:5432"
    volumes:
      - clue_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clue"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: clue
      MONGO_INITDB_ROOT_PASSWORD: clue
    ports:
      - "27017:27017"
    volumes:
      - clue_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clue_postgres_data:
  clue_mongo_data:
